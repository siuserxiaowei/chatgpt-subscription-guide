name: Check internal links

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run link checker self-test
        run: python3 scripts/check_internal_links.py --self-test
      - name: Check repository links
        run: python3 scripts/check_internal_links.py --list-external
